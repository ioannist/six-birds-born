[build-system]
requires = ["setuptools==70.2.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "born-calculus"
version = "0.1.0"
description = "Verification of an audited Born calculus on a pre-physical stochastic substrate"
readme = "README.md"
authors = [{name = "Ioannis Tsiokos"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=2.4.4,<2.6"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]
fit = ["scipy==1.17.1", "torch==2.13.0+cpu"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "LICENSE-DOCS"]

[tool.setuptools.package-data]
born_ladder = ["evidence_anchor.json", "reproduction/map_replay_assets/*.rs"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["born_ladder", "born_ladder.*"]

[tool.pytest.ini_options]
testpaths = ["tests/born_ladder"]
markers = ["data: requires explicitly supplied local historical evidence (BORN_LADDER_DATA)"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["archive", "lean_born/.lake", "vendor/pica"]
